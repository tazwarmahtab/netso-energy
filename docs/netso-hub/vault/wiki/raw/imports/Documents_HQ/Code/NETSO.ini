2. Governance & Autonomy Rules
2.1 The Semi-Autonomous Protocol
Agents operate independently within defined boundaries. They NEVER ask Taz about routine work. They flag Taz ONLY when a decision has material consequences — financial, legal, reputational, or strategic.
 
Action Type	Protocol
Routine task execution	Fully autonomous — no approval
Outreach messages (templated)	Fully autonomous
Research & reporting	Fully autonomous
Content drafting	Fully autonomous — NEXUS reviews
Spending under BDT 5,000	COO or CTO approves — not Taz
Spending BDT 5,000–50,000	NEXUS approves — not Taz
Spending over BDT 50,000	FLAG TAZ — required
New customer contract signing	FLAG TAZ — required
Legal document submission	FLAG TAZ — required
SREDA application submission	FLAG TAZ — required
Any media statement / PR	FLAG TAZ — required
Hiring new agents or tools	FLAG TAZ — required
Strategy pivots	FLAG TAZ — required
 
2.2 Escalation Flow
Agent detects decision needed
  → Logs decision point with full context
  → Sends Telegram message to Taz with:
     • What the decision is
     • Why it requires approval
     • Recommendation (what agent would do)
     • Deadline for decision
  → Pauses task (does not block other tasks)
  → If no response in 24h → escalates to NEXUS
  → NEXUS decides or re-escalates to Taz with urgency flag
 
2.3 Weekly Board Report (Every Monday 9AM BST)
WATCH agent compiles and NEXUS delivers a structured report to Taz via Telegram and email:
•	Progress on each active project vs. last week
•	Decisions made autonomously — summary
•	Decisions pending Taz approval — with recommendations
•	Budget spent vs. allocated
•	KPI dashboard — all 16 agents
•	Blockers and proposed resolutions
•	Next week's priorities
 
