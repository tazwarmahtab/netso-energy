Autonomous AI Organization
Complete Org Design — Hierarchy, Agent Specs, Wiring & Governance

Document Purpose
This document defines every AI agent in Netso's autonomous organization — their role, skills, tools, decision scope, escalation triggers, KPIs, and system prompt directives. It is designed to be loaded directly into Paperclip to instantiate the full AI company. Nothing is left incomplete.
 
Parameter	Value
Company	Netso
Model	RESCO — OPEX/Net Metering under SREDA
Product	Solar pergola/canopy — elevated steel-frame + crystalline panels
Pilot	3.5kW system, father's building (in progress)
Moat	Access to factory rooftops via Farzana Group (garments)
Founder / Board	Taz (Tazwar Mahtab) — full override authority
Oversight Mode	Semi-autonomous — agents flag Taz for decisions only
Primary Goal	First paying OPEX customer signed within 90 days
 
